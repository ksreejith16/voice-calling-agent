[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-voice-worker"
version = "0.1.0"
description = "Browser-first LiveKit and Sarvam voice feasibility worker"
requires-python = ">=3.11,<3.15"
dependencies = [
  "livekit-agents==1.8.1",
  "livekit-plugins-sarvam==1.8.1",
  "livekit-plugins-silero==1.8.1",
  "livekit-plugins-openai==1.8.1",
  "livekit==1.1.18",
  "livekit-api==1.2.1",
  "aiohttp==3.14.3",
  "openai==2.54.0",
  "pydantic==2.13.5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8", "pip-tools==7.6.1"]

[project.scripts]
india-voice-worker = "india_voice.worker:main"
india-voice-browser = "india_voice.browser:main"
india-voice-report = "india_voice.telemetry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: requires configured external credentials and explicit opt-in"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
