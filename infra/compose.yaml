name: india-voice-local
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: voice_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set local migration password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set local app password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_platform"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.8-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  livekit:
    # Pin to a specific version; "latest" can break a working setup silently.
    image: livekit/livekit-server:v1.8.0
    command:
      - "--dev"
      - "--bind"
      - "0.0.0.0"
      # Advertise loopback so ICE candidates are reachable from the same machine.
      - "--node-ip=127.0.0.1"
      # Use a single fixed UDP port for WebRTC media (easier to expose in Docker).
      - "--rtc.udp_port=7882"
      - "--keys"
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-which-must-be-at-least-32-chars}"
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      # WebRTC media transport — required for audio to flow; signaling alone is not enough.
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
